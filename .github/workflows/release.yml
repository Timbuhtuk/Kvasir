name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.1)'
        required: true
        type: string

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve release version
      env:
        MANUAL_VERSION: ${{ github.event.inputs.version }}
      run: |
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:MANUAL_VERSION }
        if ($version -notmatch '^v\d+\.\d+\.\d+$') {
          throw "Version must have the vMAJOR.MINOR.PATCH format"
        }
        "KVASIR_RELEASE_TAG=$version" >> $env:GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'vendor/nuget/*.nupkg') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Kvasir.sln --runtime win-x64

    - name: Download external dependencies
      env:
        FFMPEG_URL: ${{ secrets.FFMPEG_URL }}
        YTDLP_URL: ${{ secrets.YTDLP_URL }}
      run: ./scripts/prepare-release-media.ps1 -FfmpegUrl $env:FFMPEG_URL -YtDlpUrl $env:YTDLP_URL

    - name: Build solution
      run: dotnet build Kvasir.sln --configuration Release --no-restore --warnaserror -m:1 -p:UseSharedCompilation=false

    - name: Check architecture boundary
      run: ./scripts/check-architecture.ps1

    - name: Publish bot
      run: dotnet publish src/Kvasir/Kvasir.csproj --configuration Release --output ./artifacts/publish/win-x64/bot --runtime win-x64 --self-contained true --no-restore -m:1 -p:UseSharedCompilation=false

    - name: Publish desktop interface
      run: dotnet publish src/Kvasir.Desktop/Kvasir.Desktop.csproj --configuration Release --output ./artifacts/publish/win-x64 --runtime win-x64 --self-contained true --no-restore -m:1 -p:UseSharedCompilation=false

    - name: Verify release layout and configuration
      run: |
        $package = 'artifacts/publish/win-x64'
        $defaults = @(
          (Join-Path $package 'Defaults/configuration.json')
          (Join-Path $package 'bot/Defaults/configuration.json')
        )
        foreach ($path in $defaults) {
          $configuration = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($configuration.tokens.Count -gt 0 -or $configuration.KVASIR_DISCORD_TOKEN) {
            throw 'Release configuration template contains a Discord token.'
          }
          if ($configuration.spotify_settings.SPOTIFY_CLIENT_ID -or $configuration.spotify_settings.SPOTIFY_CLIENT_SECRET) {
            throw 'Release configuration template contains Spotify credentials.'
          }
        }
        $defaultPaths = $defaults | Resolve-Path | Select-Object -ExpandProperty Path
        $unsafe = Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object {
          $_.Name -match '^(configuration\.json|youtubeCookies\.txt|SavedMusic\.json|desktop-settings\.json|.+\.db(-shm|-wal)?)$' -and
          $_.FullName -notin $defaultPaths
        }
        if ($unsafe) {
          throw "Release contains user files: $($unsafe.Name -join ', ')."
        }

    - name: Include third-party notices
      run: |
        $licenses = New-Item -ItemType Directory -Path 'artifacts/publish/win-x64/bot/licenses' -Force
        Get-ChildItem -LiteralPath artifacts/release-media -File |
          Where-Object Name -Match '^(FFmpeg-|yt-dlp-)' |
          Copy-Item -Destination $licenses.FullName

    - name: Publish standalone EXE
      run: |
        $bot = (Resolve-Path -LiteralPath 'artifacts/publish/win-x64/bot').Path
        dotnet publish src/Kvasir.Desktop/Kvasir.Desktop.csproj --configuration Release --output ./artifacts/standalone --runtime win-x64 --self-contained true "-p:StandaloneBotDirectory=$bot" -m:1 -p:UseSharedCompilation=false --warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $files = @(Get-ChildItem -LiteralPath artifacts/standalone -Force)
        if ($files.Count -ne 1 -or $files[0].Name -ne 'Kvasir.Desktop.exe') {
          throw 'The standalone publish must produce exactly one EXE.'
        }
        Move-Item -LiteralPath $files[0].FullName -Destination "./artifacts/Kvasir-$env:KVASIR_RELEASE_TAG-win-x64.exe"

    - name: Check standalone EXE from an empty directory
      run: ./scripts/check-standalone.ps1 -Executable "./artifacts/Kvasir-$env:KVASIR_RELEASE_TAG-win-x64.exe"

    - name: Create release archive
      run: Compress-Archive -Path ./artifacts/publish/win-x64/* -DestinationPath "./artifacts/Kvasir-$env:KVASIR_RELEASE_TAG-win-x64.zip" -Force

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kvasir-release
        path: |
          ./artifacts/Kvasir-*.exe
          ./artifacts/Kvasir-*.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: 30

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = $env:KVASIR_RELEASE_TAG
        gh release create $version "./artifacts/Kvasir-$version-win-x64.exe" "./artifacts/Kvasir-$version-win-x64.zip" --target $env:GITHUB_SHA --title "Kvasir $version" --notes-file docs/RELEASE_NOTES.md
